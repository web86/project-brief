<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=d2d-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <script id="theme-bootstrap">
      ;(() => {
        let mode = 'system'
        try {
          const stored = localStorage.getItem('projectbrief.theme')
          if (['light', 'dark', 'system'].includes(stored)) mode = stored
        } catch {}
        const media = matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          const theme = mode === 'system' ? (media.matches ? 'dark' : 'light') : mode
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#15191f' : '#f7f8fa')
        }
        apply()
        media.addEventListener('change', apply)
        globalThis.projectBriefThemeBootstrap = {
          dispose: () => media.removeEventListener('change', apply),
        }
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=d2d-1" />
    <meta
      name="description"
      content="Describe what you want to change on your website. Ideas, discussions and approvals in one place."
    />
    <meta name="application-name" content="Dev2Done" />
    <meta name="apple-mobile-web-app-title" content="D2D" />
    <meta
      name="description"
      content="Dev2Done — turn project ideas into reviewed, delivered work."
    />
    <title>Dev2Done — ideas for your website</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        --bootstrap-bg: #f7f8fa;
        --bootstrap-text: #1f2937;
        --bootstrap-accent: #5b4bd6;
        --bootstrap-muted: #667085;
        --brand-detail: #7e66ea;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bootstrap-bg: #15191f;
        --bootstrap-text: #e4e9f0;
        --bootstrap-accent: #beb5ff;
        --bootstrap-muted: #a7b2c3;
        --brand-detail: #c9bdff;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: var(--bootstrap-bg);
      }
      #bootstrap-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        padding: 24px;
        color: var(--bootstrap-text);
        background: var(--bootstrap-bg);
        font-family: system-ui, sans-serif;
        text-align: center;
        transition: opacity 0.18s ease;
      }
      #bootstrap-splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .bootstrap-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.8px;
        line-height: 1;
      }
      .bootstrap-brand svg {
        width: 72px;
        height: 42px;
        color: var(--bootstrap-accent);
      }
      .bootstrap-brand .brand-light {
        font-weight: 450;
      }
      .bootstrap-dots {
        display: flex;
        gap: 6px;
        padding-top: 8px;
        color: var(--bootstrap-accent);
      }
      .bootstrap-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        animation: bootstrap-pulse 1.2s ease-in-out infinite;
      }
      .bootstrap-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .bootstrap-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      #bootstrap-label {
        color: var(--bootstrap-muted);
        font-size: 13px;
      }
      #bootstrap-fallback {
        max-width: 34em;
      }
      #bootstrap-retry {
        color: var(--bootstrap-bg);
        background: var(--bootstrap-accent);
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }
      #bootstrap-retry:focus-visible {
        outline: 2px solid var(--bootstrap-accent);
        outline-offset: 3px;
      }
      #bootstrap-fallback p {
        line-height: 1.5;
      }
      [hidden] {
        display: none !important;
      }
      @keyframes bootstrap-pulse {
        0%,
        80%,
        100% {
          opacity: 0.35;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bootstrap-dots span {
          animation: none;
        }
        #bootstrap-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="bootstrap-splash" role="status" aria-live="polite">
      <div class="bootstrap-brand" role="img" aria-label="Dev2Done">
        <!-- brand-mark:start -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 220 128"
          role="img"
          aria-label="Dev2Done logo mark"
        >
          <defs>
            <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#40D4FF" />
              <stop offset="0.46" stop-color="#168CF8" />
              <stop offset="1" stop-color="#3659F3" />
            </linearGradient>
            <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#6463FF" />
              <stop offset="0.50" stop-color="#9B4FF9" />
              <stop offset="1" stop-color="#CD43F6" />
            </linearGradient>
            <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#238AFB" />
              <stop offset="0.62" stop-color="#5B56EE" />
              <stop offset="1" stop-color="#9961FA" />
            </linearGradient>
          </defs>
          <!-- The squared, visible left stem keeps the second letter recognisably D, not O. -->
          <path
            fill="url(#violet)"
            fill-rule="evenodd"
            d="M109 13H153C191 13 212 34 212 64S191 115 153 115H109Q103 115 103 109V19Q103 13 109 13ZM130 40V88H151C169 88 184 78 184 64S169 40 151 40Z"
          />
          <!-- First D runs into a forward chevron, the route from Dev to Done. -->
          <path
            fill="url(#blue)"
            fill-rule="evenodd"
            d="M12 13H58C93 13 109 34 124 49L139 63Q141 65 139 68L123 84C106 103 91 115 58 115H12Q6 115 6 109V19Q6 13 12 13ZM34 40V88H57C73 88 84 81 97 66L99 64L97 61C84 46 73 40 57 40Z"
          />
          <!-- Subtle blue-violet overlap conveys movement without making the second D into O. -->
          <path
            fill="url(#link)"
            d="M101 35C109 42 116 51 124 59L139 63Q141 65 139 68L121 87C115 94 109 99 101 104L83 88C89 83 95 77 100 71L106 64L100 57C95 52 89 45 83 41Z"
            opacity=".94"
          />
          <path
            d="m150 64 12 12 24-26"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="10"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
        <!-- brand-mark:end -->
        <span aria-hidden="true">Dev<span class="brand-light">2Done</span></span>
      </div>
      <div class="bootstrap-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <span id="bootstrap-label">Loading…</span>
      <div id="bootstrap-fallback" hidden>
        <p id="bootstrap-error">Could not open the app.</p>
        <button type="button" id="bootstrap-retry">Try again</button>
      </div>
      <noscript>Enable JavaScript to open your project.</noscript>
    </div>
    <script>
      ;(() => {
        const splash = document.getElementById('bootstrap-splash')
        let complete = false
        const translations = /* locale-bootstrap */ {}
        const resolveBrowserLocale = /* browser-locale-resolver */ () => 'en'
        const catalog = /* browser-locale-catalog */ []
        let language = resolveBrowserLocale(
          navigator.languages?.[0] || navigator.language || 'en',
          catalog,
        )
        try {
          const manual = localStorage.getItem('projectbrief.locale')
          if (Object.hasOwn(translations, manual)) language = manual
        } catch {}
        if (!Object.hasOwn(translations, language)) language = 'en'
        const text = translations[language]
        document.documentElement.lang = language
        document.title = text.title
        document.querySelector('meta[name="description"]').content = text.description
        document.getElementById('bootstrap-label').textContent = text.loading
        document.getElementById('bootstrap-error').textContent = text.error
        document.getElementById('bootstrap-retry').textContent = text.retry
        document.getElementById('bootstrap-retry').onclick = () => location.reload()
        function fail() {
          if (complete) return
          splash.querySelector('.bootstrap-dots').hidden = true
          document.getElementById('bootstrap-label').hidden = true
          document.getElementById('bootstrap-fallback').hidden = false
        }
        const timer = setTimeout(fail, 25000)
        window.addEventListener('error', fail, true)
        window.projectBriefBootstrap = {
          fail,
          complete() {
            complete = true
            clearTimeout(timer)
            window.removeEventListener('error', fail, true)
            splash.classList.add('leaving')
            setTimeout(
              () => splash.remove(),
              matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180,
            )
          },
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
