<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4.9.1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <script id="theme-bootstrap">
      ;(() => {
        let mode = 'system'
        try {
          const stored = localStorage.getItem('projectbrief.theme')
          if (['light', 'dark', 'system'].includes(stored)) mode = stored
        } catch {}
        const media = matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          const theme = mode === 'system' ? (media.matches ? 'dark' : 'light') : mode
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#15191f' : '#f7f8fa')
        }
        apply()
        media.addEventListener('change', apply)
        globalThis.projectBriefThemeBootstrap = {
          dispose: () => media.removeEventListener('change', apply),
        }
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4.9.1" />
    <meta
      name="description"
      content="Describe what you want to change on your website. Ideas, discussions and approvals in one place."
    />
    <title>Project Brief — ideas for your website</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        --bootstrap-bg: #f7f8fa;
        --bootstrap-text: #1f2937;
        --bootstrap-accent: #243b62;
        --bootstrap-muted: #667085;
        --brand-detail: #5979a6;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bootstrap-bg: #15191f;
        --bootstrap-text: #e4e9f0;
        --bootstrap-accent: #9dbff4;
        --bootstrap-muted: #a7b2c3;
        --brand-detail: #bad2fa;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: var(--bootstrap-bg);
      }
      #bootstrap-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        padding: 24px;
        color: var(--bootstrap-text);
        background: var(--bootstrap-bg);
        font-family: system-ui, sans-serif;
        text-align: center;
        transition: opacity 0.18s ease;
      }
      #bootstrap-splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .bootstrap-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.8px;
        line-height: 1;
      }
      .bootstrap-brand svg {
        width: 42px;
        height: 42px;
        color: var(--bootstrap-accent);
      }
      .bootstrap-brand .brand-light {
        font-weight: 450;
      }
      .bootstrap-dots {
        display: flex;
        gap: 6px;
        padding-top: 8px;
        color: var(--bootstrap-accent);
      }
      .bootstrap-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        animation: bootstrap-pulse 1.2s ease-in-out infinite;
      }
      .bootstrap-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .bootstrap-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      #bootstrap-label {
        color: var(--bootstrap-muted);
        font-size: 13px;
      }
      #bootstrap-fallback {
        max-width: 34em;
      }
      #bootstrap-retry {
        color: var(--bootstrap-bg);
        background: var(--bootstrap-accent);
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }
      #bootstrap-retry:focus-visible {
        outline: 2px solid var(--bootstrap-accent);
        outline-offset: 3px;
      }
      #bootstrap-fallback p {
        line-height: 1.5;
      }
      [hidden] {
        display: none !important;
      }
      @keyframes bootstrap-pulse {
        0%,
        80%,
        100% {
          opacity: 0.35;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bootstrap-dots span {
          animation: none;
        }
        #bootstrap-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="bootstrap-splash" role="status" aria-live="polite">
      <div class="bootstrap-brand" role="img" aria-label="projectbrief">
        <!-- brand-mark:start -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="96 104 320 304" aria-hidden="true">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M128 136 H154 C161 136 166 141 166 148 V154 C183 138 204 130 228 130 C287 130 326 170 326 228 C326 284 287 324 230 324 C206 324 184 318 166 304 V376 C166 383 161 388 154 388 H128 C121 388 116 383 116 376 V148 C116 141 121 136 128 136 Z M166 228 C166 261 188 282 220 282 C253 282 276 261 276 228 C276 195 253 174 220 174 C188 174 166 195 166 228 Z"
          />
          <circle cx="366" cy="300" r="24" fill="var(--brand-detail, currentColor)" />
        </svg>
        <!-- brand-mark:end -->
        <span aria-hidden="true">project<span class="brand-light">brief</span></span>
      </div>
      <div class="bootstrap-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <span id="bootstrap-label">Loading…</span>
      <div id="bootstrap-fallback" hidden>
        <p id="bootstrap-error">Could not open the app.</p>
        <button type="button" id="bootstrap-retry">Try again</button>
      </div>
      <noscript>Enable JavaScript to open your project.</noscript>
    </div>
    <script>
      ;(() => {
        const splash = document.getElementById('bootstrap-splash')
        let complete = false
        const translations = /* locale-bootstrap */ {}
        const resolveBrowserLocale = /* browser-locale-resolver */ () => 'en'
        const catalog = /* browser-locale-catalog */ []
        let language = resolveBrowserLocale(
          navigator.languages?.[0] || navigator.language || 'en',
          catalog,
        )
        try {
          const manual = localStorage.getItem('projectbrief.locale')
          if (Object.hasOwn(translations, manual)) language = manual
        } catch {}
        if (!Object.hasOwn(translations, language)) language = 'en'
        const text = translations[language]
        document.documentElement.lang = language
        document.title = text.title
        document.querySelector('meta[name="description"]').content = text.description
        document.getElementById('bootstrap-label').textContent = text.loading
        document.getElementById('bootstrap-error').textContent = text.error
        document.getElementById('bootstrap-retry').textContent = text.retry
        document.getElementById('bootstrap-retry').onclick = () => location.reload()
        function fail() {
          if (complete) return
          splash.querySelector('.bootstrap-dots').hidden = true
          document.getElementById('bootstrap-label').hidden = true
          document.getElementById('bootstrap-fallback').hidden = false
        }
        const timer = setTimeout(fail, 25000)
        window.addEventListener('error', fail, true)
        window.projectBriefBootstrap = {
          fail,
          complete() {
            complete = true
            clearTimeout(timer)
            window.removeEventListener('error', fail, true)
            splash.classList.add('leaving')
            setTimeout(
              () => splash.remove(),
              matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180,
            )
          },
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
